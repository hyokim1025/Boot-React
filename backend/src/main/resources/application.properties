spring.application.name=mallapi
server.address=127.0.0.1
server.port=8080

spring.config.import=optional:file:../.local/application-local.properties
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3308/malldb}
spring.datasource.username=${DB_USERNAME:malldbuser}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
